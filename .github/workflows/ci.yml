# CI du site utilisateur — bloquante sur chaque pull request.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:ci
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test:ci
      - run: pnpm build
      - name: Audit des dépendances (vulnérabilités hautes et critiques)
        run: pnpm audit --prod --audit-level high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-reports
          path: reports/
          retention-days: 7
